# 公共配置文件
# @author biny
spring:
  application:
    name: yuoj-backend
  # 默认 prod 环境
  profiles:
    active: prod
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/boj}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
  # Redis 配置
  redis:
    database: ${REDIS_DATABASE:1}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: ${REDIS_TIMEOUT_MS:5000}
    password: ${REDIS_PASSWORD:}
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
#  elasticsearch:
#    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
#    username: ${ELASTICSEARCH_USERNAME:}
#    password: ${ELASTICSEARCH_PASSWORD:}
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
server:
  address: 0.0.0.0
  port: 8121
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 微信相关
wx:
  # 微信公众平台
  # todo 需替换配置
  mp:
    token: ${WX_MP_TOKEN:}
    aesKey: ${WX_MP_AES_KEY:}
    appId: ${WX_MP_APP_ID:}
    secret: ${WX_MP_SECRET:}
    config-storage:
      http-client-type: HttpClient
      key-prefix: wx
      redis:
        host: 127.0.0.1
        port: 6379
      type: Memory
  # 微信开放平台
  # todo 需替换配置
  open:
    appId: ${WX_OPEN_APP_ID:}
    appSecret: ${WX_OPEN_APP_SECRET:}
# 对象存储
# todo 需替换配置
cos:
  client:
    accessKey: ${COS_ACCESS_KEY:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}
# 代码沙箱配置
codesandbox:
  type: ${CODESANDBOX_TYPE:remote}
ai:
  chat:
    enabled: ${AI_CHAT_ENABLED:false}
    base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_CHAT_API_KEY:}
    model: ${AI_CHAT_MODEL:deepseek-chat}
    timeout-ms: ${AI_CHAT_TIMEOUT_MS:15000}
    stream-timeout-ms: ${AI_CHAT_STREAM_TIMEOUT_MS:60000}
    max-output-tokens: ${AI_CHAT_MAX_OUTPUT_TOKENS:800}
    max-input-chars: ${AI_CHAT_MAX_INPUT_CHARS:12000}
    max-history-messages: ${AI_CHAT_MAX_HISTORY_MESSAGES:10}
    temperature: ${AI_CHAT_TEMPERATURE:0.2}
spj:
  enabled: ${SPJ_ENABLED:true}
  checker-source: ${SPJ_CHECKER_SOURCE:scripts/spj/checker.cpp}
  checker-binary: ${SPJ_CHECKER_BINARY:scripts/spj/checker}
  compile-timeout-ms: ${SPJ_COMPILE_TIMEOUT_MS:10000}
  run-timeout-ms: ${SPJ_RUN_TIMEOUT_MS:2000}
